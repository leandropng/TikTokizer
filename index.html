<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Likes Randomizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--text:#0b0b0d;--muted:rgba(11,11,13,.56);--bg:#f3f3f6;--card:#fff;--fill:rgba(120,120,128,.1);--track:rgba(120,120,128,.16);--sh:0 0 0 1px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04),0 14px 34px -14px rgba(0,0,0,.16);--acc:#fe2c55;--acc-t:rgba(254,44,85,.12);
--ease-out:cubic-bezier(.23,1,.32,1);--ease-drawer:cubic-bezier(.32,.72,0,1);--spring:cubic-bezier(.34,1.3,.64,1);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--text:#f4f4f6;--muted:rgba(244,244,246,.58);--bg:#08080a;--card:#151518;--fill:rgba(255,255,255,.07);--track:rgba(255,255,255,.12);--sh:0 0 0 1px rgba(255,255,255,.08),0 14px 34px -14px rgba(0,0,0,.7);--acc-t:rgba(254,44,85,.2)}}
:root[data-theme="dark"]{--text:#f4f4f6;--muted:rgba(244,244,246,.58);--bg:#08080a;--card:#151518;--fill:rgba(255,255,255,.07);--track:rgba(255,255,255,.12);--sh:0 0 0 1px rgba(255,255,255,.08),0 14px 34px -14px rgba(0,0,0,.7);--acc-t:rgba(254,44,85,.2)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;min-height:100%}
body{background-color:var(--bg);background-image:radial-gradient(100% 46% at 50% -6%,rgba(254,44,85,.16),transparent 70%);background-repeat:no-repeat;background-attachment:fixed;color:var(--text);font-family:"Inter",-apple-system,"SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;font-size:15px;line-height:1.45;letter-spacing:-.011em;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;letter-spacing:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-appearance:none;appearance:none}
main{max-width:480px;margin:0 auto;padding:18px 16px 28px}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin:22px 2px 6px}
h1{font-size:2.5rem;font-weight:800;letter-spacing:-.045em;line-height:1.02;margin:0 2px 8px;text-wrap:balance}
.sub{color:var(--muted);margin:0 2px 22px;text-wrap:pretty}
.ent{transition:opacity .28s var(--ease-out),transform .28s var(--ease-out),filter .28s var(--ease-out)}
.ent.pre{opacity:0;transform:translateY(12px) scale(.97);filter:blur(2px)}
.ent.out{opacity:0;transform:translateY(-6px) scale(.97);filter:blur(2px);transition-duration:.16s;pointer-events:none}
.grp{background:var(--card);border-radius:28px;padding:8px;box-shadow:var(--sh);display:grid;gap:8px}
.card{background:var(--card);box-shadow:var(--sh)}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:999px;background:var(--track);touch-action:none;-webkit-user-select:none;user-select:none}
.thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:rgba(255,255,255,.3);backdrop-filter:blur(6px) saturate(190%) brightness(1.15);-webkit-backdrop-filter:blur(6px) saturate(190%) brightness(1.15);border:1px solid rgba(255,255,255,.8);box-shadow:inset 0 2px 6px rgba(255,255,255,.7),inset 0 -2px 6px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.18);transition:transform .35s var(--ease-drawer),scale .3s var(--spring);cursor:grab;will-change:transform}
.seg.grab .thumb{scale:1.1 1.32;box-shadow:inset 0 2px 6px rgba(255,255,255,.8),0 10px 30px rgba(0,0,0,.3)}
.seg button{position:relative;z-index:1;background:none;border:0;color:var(--text);font-weight:600;min-height:42px;cursor:pointer;opacity:.55;transition:opacity .2s}
.seg button.on{opacity:1}
#mseg{margin-top:2px}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:30px 16px 26px;text-align:center;cursor:pointer;border-radius:20px;background:var(--fill);transition:transform .2s var(--ease-out),background-color .2s}
.drop.over{transform:scale(1.02);background:var(--track)}
.drop:active{transform:scale(1.03)}
.ico{width:64px;height:64px;border-radius:50%;background:var(--acc-t);color:var(--acc);display:grid;place-items:center;margin-bottom:6px}
.ico svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;animation:bob 2.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.drop b{font-size:1.05rem;font-weight:700}.drop span{color:var(--muted);font-size:.88rem;overflow-wrap:anywhere;max-width:100%}
.file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
textarea{display:block;width:100%;min-height:150px;resize:vertical;border-radius:20px;border:0;background:var(--fill);color:var(--text);font:inherit;font-size:16px;padding:14px;outline:none}
textarea:focus{box-shadow:0 0 0 2px #7a5cff}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border-radius:22px;padding:14px 16px;box-shadow:var(--sh);transition:transform .2s var(--ease-out),box-shadow .2s var(--ease-out)}
.tile:active{transform:scale(1.04)}
.tile.on{box-shadow:0 0 0 2px var(--acc),0 14px 34px -14px rgba(254,44,85,.35)}
.tile b{display:block;font-size:1.9rem;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{color:var(--muted);font-size:.82rem;font-weight:600}
.btn{border:0;border-radius:999px;padding:0 22px;min-height:54px;font-weight:700;color:#fff;cursor:pointer;background:var(--acc);transition:transform .2s var(--ease-out)}
.btn.big{width:100%;margin-top:12px;font-size:1rem}
.btn:active,.go:active{transform:scale(1.05);transition-duration:.12s}
.chip{font-weight:600;font-size:.88rem;color:var(--text);min-height:40px;padding:0 14px;border-radius:999px;cursor:pointer;border:0;background:var(--fill);transition:transform .2s var(--ease-out),background-color .2s,color .2s}
.chip:active{transform:scale(1.1);transition-duration:.12s}
.chip.on{background:var(--acc);color:#fff}
.chip:disabled{opacity:.4;pointer-events:none}
@media (hover:hover) and (pointer:fine){.btn:hover,.go:hover{transform:scale(1.02)}.chip:hover,.rb:hover{transform:scale(1.05)}.drop:hover{background:var(--track)}}
:focus-visible{outline:2px solid #7a5cff;outline-offset:2px}
.status{min-height:1.3em;text-align:center;color:var(--muted);font-size:.9rem;overflow-wrap:anywhere;margin-top:10px}
.shake{animation:shake .35s var(--ease-out)}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.faq{margin-top:6px}
.acc{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;color:var(--text);font-weight:600;padding:12px 14px;min-height:48px;cursor:pointer;text-align:left}
.acc i{width:28px;height:28px;border-radius:50%;background:var(--track);color:var(--muted);display:grid;place-items:center;flex:none;transition:transform .3s var(--ease-out)}.acc i svg{width:16px;height:16px}.acc.open i{transform:rotate(180deg)}
.accbody{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .35s var(--ease-out),opacity .25s var(--ease-out);color:var(--muted);font-size:.9rem}
.accbody.open{grid-template-rows:1fr;opacity:1}
.accbody>div{overflow:hidden}
.accbody ol{margin:0;padding:12px 14px 14px 34px}
#favL{padding-top:6px}
.accbody li{transform:translateY(6px);opacity:0;transition:transform .3s var(--ease-out),opacity .3s var(--ease-out);padding:2px 0}
.accbody.open li{transform:none;opacity:1}
.accbody.open li:nth-child(2){transition-delay:.04s}.accbody.open li:nth-child(3){transition-delay:.08s}.accbody.open li:nth-child(4){transition-delay:.12s}
.bar0{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;margin:4px 0 12px}
.count{font-weight:600;font-size:.85rem;color:var(--muted);text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.rt{display:flex;gap:6px}
.rt .chip{display:grid;place-items:center;min-width:40px;padding:0 11px}
.stage{padding:8px;border-radius:32px;height:min(540px,62vh);height:min(540px,62dvh)}
.stage.ent{transition-duration:.2s}
.stage iframe{display:block;width:100%;height:100%;border:0;border-radius:24px;background:rgba(0,0,0,.2)}
.ph{height:100%;border-radius:24px;background:var(--fill);display:grid;grid-template-rows:auto 1fr auto;padding:16px;overflow:hidden}
.ago{justify-self:start;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);background:var(--acc-t);padding:6px 12px;border-radius:999px;min-height:26px}
.ago:empty{visibility:hidden}
.play{align-self:center;justify-self:center;width:92px;height:92px;border-radius:50%;border:0;background:var(--acc);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 16px 36px -10px rgba(254,44,85,.65);transition:transform .2s var(--ease-out)}
.play:active{transform:scale(1.08);transition-duration:.12s}
.play:disabled{opacity:.35;pointer-events:none}
.play svg{width:36px;height:36px;margin-left:5px;fill:currentColor}
.meta{text-align:center}
.cap{display:block;font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pd{display:block;font-size:1.65rem;font-weight:800;letter-spacing:-.04em;line-height:1.15;margin:4px 0;font-variant-numeric:tabular-nums;text-wrap:balance}
.meta small{color:var(--muted)}
.dock{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:center;gap:10px;margin:14px auto 0;width:fit-content;max-width:100%;padding:8px;border-radius:999px;background:var(--card);box-shadow:var(--sh)}
.rb{width:52px;height:52px;border-radius:50%;border:0;background:var(--fill);color:var(--text);display:grid;place-items:center;cursor:pointer;transition:transform .2s var(--ease-out)}
.rb:active{transform:scale(1.12);transition-duration:.12s}
.rb svg,.go svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.go{display:flex;align-items:center;gap:8px;height:56px;padding:0 26px;border:0;border-radius:999px;background:var(--acc);color:#fff;font-weight:700;font-size:1rem;cursor:pointer;transition:transform .2s var(--ease-out)}
.go svg circle{fill:currentColor;stroke:none}
.note{text-align:center;color:var(--muted);font-size:.78rem;margin:12px 0 0}
.kb{display:none}
@media (hover:hover) and (pointer:fine){.kb{display:inline}}
.scrim{position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s var(--ease-out)}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:6;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(456px,calc(100% - 20px));max-height:84vh;max-height:84dvh;overflow:auto;overscroll-behavior:contain;border-radius:32px;padding:0 14px 14px;translate:-50% calc(100% + 40px);visibility:hidden;display:grid;gap:10px;transition:translate .28s var(--ease-drawer),visibility 0s .28s}
.sheet.open{translate:-50% 0;visibility:visible;transition:translate .4s var(--ease-drawer),visibility 0s}
.gp{height:28px;display:grid;place-items:center;touch-action:none;cursor:grab}
.gp::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--track)}
.sheet h2{margin:0 4px 2px;font-size:1.5rem;font-weight:800;letter-spacing:-.04em}
.hdg{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 8px 0}
.lst{background:var(--fill);border-radius:20px;overflow:hidden}
.pad{padding:12px 14px}
.rw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;min-height:54px}
.rw+.rw,.lst>.acc+.accbody{box-shadow:inset 0 1px 0 var(--track)}
button.rw{width:100%;border:0;background:none;color:var(--text);cursor:pointer}
.rw.danger{color:var(--acc);justify-content:center;font-weight:600}
small{display:block;color:var(--muted);font-size:.8rem}
.opts{display:flex;gap:6px}
.sw{position:relative;width:54px;height:32px;border-radius:99px;background:rgba(120,120,128,.38);border:0;cursor:pointer;transition:background-color .25s var(--ease-out);flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:99px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .3s var(--ease-out),width .2s var(--ease-out)}
.sw.on{background:#34c759}.sw.on::after{transform:translateX(22px)}.sw:active::after{width:34px}.sw.on:active::after{transform:translateX(14px)}
.fi{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 14px;font-size:.85rem;animation:fin .3s var(--ease-out) backwards;animation-delay:calc(var(--i)*40ms);transition:opacity .2s var(--ease-out),transform .2s var(--ease-out)}
@keyframes fin{from{opacity:0;transform:translateX(-10px)}}
.fi.gone{opacity:0;transform:translateX(24px)}
.fi a{color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#favL>small{padding:4px 14px 12px}
.chart{display:flex;align-items:flex-end;gap:5px;height:112px;overflow-x:auto;padding-bottom:2px}
.col{display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;min-width:20px}
.col span{font-size:.6rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{width:16px;border:0;border-radius:6px 6px 3px 3px;background:var(--track);cursor:pointer;transform:scaleY(0);transform-origin:bottom;transition:transform .45s var(--ease-out),background-color .2s;transition-delay:calc(var(--i)*18ms),0s}
.chart.run .bar{transform:none}
.bar.on{background:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .chip{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--card)}
.chips .chip.on{background:var(--acc)}
.dp{display:grid;gap:10px}
.dp input{font:inherit;font-size:16px;color:var(--text);background:var(--card);border:0;border-radius:14px;padding:12px 14px;min-height:46px;width:100%;box-shadow:var(--sh)}
:root[data-theme="dark"] .dp input{color-scheme:dark}:root[data-theme="light"] .dp input{color-scheme:light}
#dtoday,.dp .chip{background:var(--card)}
#dtoday.on,.dp .chip.on{background:var(--acc);color:#fff}
.ft{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:2px}
.ft .btn{min-height:50px}
.ft .chip{min-height:50px}
@media (prefers-reduced-motion:reduce){
  .ent.pre,.ent.out{transform:none;filter:none}
  .sheet{translate:-50% 0;opacity:0;transition:opacity .2s,visibility 0s .2s}.sheet.open{opacity:1;transition:opacity .2s,visibility 0s}
  .thumb,.btn,.chip,.rb,.go,.tile,.drop,.acc i,.accbody li,.sw::after{transition-property:opacity,background-color,color}
  .ico svg,.fi,.shake{animation:none}.bar{transform:none}
}
.eyebrow{margin:0 2px}
.hrow{display:flex;align-items:center;justify-content:space-between;margin:16px 0 6px}
.hrow .chip{display:grid;place-items:center;min-width:40px;padding:0 11px}
.opts .chip{background:var(--card)}
.opts .chip.on{background:var(--acc);color:#fff}
.credit{justify-content:center;color:var(--muted);font-weight:600}
.gtrig{background:rgba(120,120,128,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.55);transition:transform .21s var(--ease-out),opacity .15s}
.chip.gm-away{opacity:0;transform:scale(.25)}
:root{--gmtint:rgba(255,255,255,.55)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gmtint:rgba(34,34,42,.55)}}
:root[data-theme="dark"]{--gmtint:rgba(34,34,42,.55)}
.gm-veil{position:fixed;inset:0;z-index:8}
.gm{position:fixed;z-index:9;padding:6px;border-radius:26px;background:var(--gmtint);backdrop-filter:blur(22px) saturate(190%) brightness(1.06);-webkit-backdrop-filter:blur(22px) saturate(190%) brightness(1.06);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.65),inset 0 0 0 1px rgba(255,255,255,.2),0 20px 50px -12px rgba(0,0,0,.4);opacity:0;transform:scale(.14);transition:transform .22s ease-in,opacity .16s ease-in;will-change:transform}
.gm::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 60% at 15% 0%,rgba(255,255,255,.38),transparent 55%)}
.gm.open{opacity:1;transform:none;transition:transform .45s cubic-bezier(.34,1.45,.64,1),opacity .18s ease-out}
.gm-hl{position:absolute;left:6px;right:6px;top:0;height:46px;border-radius:16px;background:rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.5);opacity:0;transition:transform .2s var(--ease-out),height .2s var(--ease-out),opacity .15s;pointer-events:none}
.gm-item{position:relative;z-index:1;display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:0 12px;border:0;background:none;color:var(--text);font-weight:500;font-size:1rem;border-radius:16px;cursor:pointer;text-align:left}
.gm-item.bad{color:var(--acc)}
.gm-item:disabled{opacity:.4;pointer-events:none}
.gm-ic{width:22px;height:22px;display:grid;place-items:center;flex:none}
.gm-ic svg,.gm-ck svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gm-t{flex:1}
.gm-ck{width:20px;height:20px;color:var(--acc);flex:none}
.gm-sep{height:1px;margin:4px 12px;background:rgba(120,120,128,.28)}
.gm-lbl{position:relative;padding:8px 12px 2px;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
</style>
</head>
<body>
<main>
<div class="seg" id="mseg"><div class="thumb"></div><button class="on" data-i="tab_likes" data-n="0"></button><button data-i="tab_favs" data-n="1"></button></div>
<div class="hrow"><div class="eyebrow">TikTok</div><button class="chip" id="gear2" data-ia="a_menu" aria-label="Menu" aria-haspopup="menu"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg></button></div>
<h1 class="ent" id="title">Likes Randomizer</h1>
<p class="sub ent" id="sub"></p>

<section class="view ent" id="setup">
  <div class="grp">
    <div class="seg" id="dseg"><div class="thumb"></div><button class="on" data-i="seg_file"></button><button data-i="seg_links"></button></div>
    <div id="p0" class="ent">
      <label class="drop" id="drop" for="file">
        <span class="ico"><svg viewBox="0 0 48 48"><path d="M24 33V9M14 19l10-10 10 10"/><path d="M8 30v6a4 4 0 0 0 4 4h24a4 4 0 0 0 4-4v-6"/></svg></span>
        <b data-i="drop_title"></b><span id="fname"></span>
      </label>
      <input class="file" type="file" id="file" accept=".json,.txt">
    </div>
    <div id="p1" class="ent" hidden><textarea id="paste" data-ip="paste_ph"></textarea></div>
  </div>
  <div class="stats" id="stats" hidden>
    <button class="tile on" id="tLikes"><b id="nLikes">0</b><span data-i="st_likes"></span></button>
    <button class="tile" id="tFavs"><b id="nFavs">0</b><span data-i="st_favs"></span></button>
  </div>
  <button class="btn big" id="load" data-i="load"></button>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="grp faq"><div class="lst">
    <button class="acc" id="acc" aria-expanded="false"><span data-i="faq_title"></span><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></i></button>
    <div class="accbody" id="accb"><div><ol>
      <li data-i="faq1"></li><li data-i="faq2"></li><li data-i="faq3"></li><li data-i="faq4"></li>
    </ol></div></div>
  </div></div>
</section>

<section class="view ent" id="player" hidden>
  <div class="bar0">
    <button class="chip" id="back" data-i="back"></button>
    <span class="count" id="count" aria-live="polite"></span>
    <span class="rt">

  [].forEach.call(bs,function(b){b.onclick=function(){set(+b.dataset.i)}});
  seg.addEventListener('pointerdown',function(e){if(pid!==null)return;pid=e.pointerId;drag=false;sx=e.clientX;t0=e.timeStamp;seg.classList.add('grab')});
  seg.addEventListener('pointermove',function(e){if(e.pointerId!==pid)return;var dx=e.clientX-sx;
    if(!drag&&Math.abs(dx)>5){drag=true;try{seg.setPointerCapture(pid)}catch(x){}th.style.transition=T}
    if(drag){var w=th.offsetWidth,raw=cur*w+dx;pos=raw<0?-band(-raw):raw>w?w+band(raw-w):raw;th.style.transform='translateX('+pos+'px)'}});
  seg.addEventListener('pointerup',function(e){if(e.pointerId!==pid)return;var was=drag,dx=e.clientX-sx,v=Math.abs(dx)/Math.max(1,e.timeStamp-t0);pid=null;drag=false;th.style.transition='';
    if(was){var w=th.offsetWidth;set(v>.11&&Math.abs(dx)>10?(dx>0?1:0):(pos>w/2?1:0))}
    setTimeout(function(){seg.classList.remove('grab')},was?0:240)});
  seg.addEventListener('pointercancel',function(e){if(e.pointerId!==pid)return;pid=null;drag=false;th.style.transition='';set(cur,true);seg.classList.remove('grab')});
  return{set:set}}

$('load').onclick=function(){var f=$('file').files[0],pasted=$('paste').value;

/* entdecken */
function disc(anim){var l=list(),dated=l.filter(function(x){return x.d}),T=today(),ds=dated.map(function(x){return x.d}).sort();
  $('dsum').textContent=nf(l.length)+' '+t('vn')+(ds.length?' · '+ds[0]+' '+t('to')+' '+ds[ds.length-1]:'');
  var months={},years={};dated.forEach(function(x){var m=x.d.slice(0,7),y=x.d.slice(0,4);months[m]=(months[m]||0)+1;years[y]=(years[y]||0)+1});
  var g=Object.keys(months).length>24?years:months,keys=Object.keys(g).sort(),mx=1;keys.forEach(function(k){if(g[k]>mx)mx=g[k]});
  var h='';keys.forEach(function(k,i){h+='<div class="col"><button class="bar'+(filt&&filt.t==='p'&&filt.v===k?' on':'')+'" data-k="'+k+'" title="'+g[k]+'" style="--i:'+i+';height:'+Math.max(6,Math.round(g[k]/mx*84))+'px"></button><span>'+(k.length===7?k.slice(5):k.slice(2))+'</span></div>'});
  var ch=$('dchart');
  if(anim){ch.classList.remove('run');ch.innerHTML=h;requestAnimationFrame(function(){requestAnimationFrame(function(){ch.classList.add('run')})})}
  else{ch.classList.add('run');ch.innerHTML=h}
  if(!h)ch.innerHTML='<small>'+t('ex_nodates')+'</small>';
  $('dread').textContent=filt?filtLabel()+' · '+nf(poolNow().length)+' '+t('vn'):t('ex_bar');
  var cm={};l.forEach(function(x){var c=cre(x.u);if(c&&c!=='_')cm[c]=(cm[c]||0)+1});
  var top=Object.keys(cm).sort(function(a,b){return cm[b]-cm[a]}).slice(0,8),c='';
  top.forEach(function(k){c+='<button class="chip'+(filt&&filt.t==='c'&&filt.v===k?' on':'')+'" data-c="'+esc(k)+'">@'+esc(k)+' · '+cm[k]+'</button>'});
  $('dcre').innerHTML=c||'<small>'+t('ex_nocre')+'</small>';
  var tn=dated.filter(function(x){return x.d.slice(5)===T.md&&x.d.slice(0,4)!==T.y}).length,tb=$('dtoday');
  tb.textContent=t('ex_today_btn',[tn]);tb.disabled=!tn;tb.classList.toggle('on',!!filt&&filt.t==='t');
  $('ddate').value=filt&&filt.t==='d'?filt.raw:'';
  $('dany').classList.toggle('on',dmode==='any');$('dexact').classList.toggle('on',dmode==='exact');
  $('dtn').textContent=filt&&filt.t==='d'?(poolNow().length?t('ex_dtn',[nf(poolNow().length)]):t('ex_dtn0')):t('ex_dtnh')}

document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('.btn,.chip,.rb,.go');if(b&&b.id!=='star')pulse(b,1.08,240)});
/* keyboard: instant, no animation */
document.addEventListener('keydown',function(e){var tg=e.target.tagName;if(tg==='TEXTAREA'||tg==='INPUT'||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='Escape'){closeAll();return}
  if($('player').hidden||GM.open||document.querySelector('.sheet.open'))return;
  if(tg==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;
  var k=e.key.toLowerCase();
  if(k==='arrowright'||k===' '||k==='n'){e.preventDefault();next(true)}
  else if(k==='arrowleft'||k==='p'||k==='backspace'){e.preventDefault();prev(true)}
  else if(k==='s'){toggleFav(true)}});

[].forEach.call(document.querySelectorAll('.sheet'),function(sh){var g=sh.querySelector('.gp'),sy=0,t0=0,pid=null,dy=0;
  g.addEventListener('pointerdown',function(e){pid=e.pointerId;sy=e.clientY;t0=e.timeStamp;dy=0;try{g.setPointerCapture(pid)}catch(x){}sh.style.transition='translate 0s'});

var dmode='any';

updSeen();
/* glass menu – web take on rit3zh/expo-glass-custom-menu: morph from trigger, press-drag-release, jelly */
var GM={open:false,drag:false,trig:null,getItems:null,items:[]};
var IC={chart:'<path d="M5 20V11M12 20V4M19 20v-6"/>',star:'<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9 6.8 19.6l1-5.8L3.5 9.7l5.9-.9z"/>',play:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4-2.5z"/>',sliders:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/>'};
function svgi(n){return'<svg viewBox="0 0 24 24">'+(IC[n]||'')+'</svg>'}
GM.el=document.createElement('div');GM.el.className='gm';GM.el.setAttribute('role','menu');GM.el.hidden=true;GM.el.innerHTML='<div class="gm-hl"></div><div class="gm-list"></div>';
GM.veil=document.createElement('div');GM.veil.className='gm-veil';GM.veil.hidden=true;
document.body.appendChild(GM.veil);document.body.appendChild(GM.el);GM.hl=GM.el.firstChild;GM.list=GM.el.lastChild;
function gmRender(){var it=GM.getItems(),any=it.some(function(x){return'checked'in x}),h='';GM.items=it;
  it.forEach(function(x,i){
    if(x.separator)h+='<div class="gm-sep"></div>';
    else if(x.label)h+='<div class="gm-lbl">'+esc(x.label)+'</div>';
    else h+='<button class="gm-item'+(x.destructive?' bad':'')+'" role="menuitem" data-k="'+i+'"'+(x.disabled?' disabled':'')+'><span class="gm-ic">'+svgi(x.icon)+'</span><span class="gm-t">'+esc(x.title)+'</span>'+(any?'<span class="gm-ck">'+(x.checked?'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>':'')+'</span>':'')+'</button>'});
  GM.list.innerHTML=h}
function gmOpen(trig,getItems){if(GM.open)return;GM.open=true;GM.trig=trig;GM.getItems=getItems;gmRender();
  var r=trig.getBoundingClientRect(),el=GM.el,vw=window.innerWidth,vh=window.innerHeight,w=Math.min(264,vw-24);
  el.hidden=false;GM.veil.hidden=false;el.style.width=w+'px';
  var h=el.offsetHeight,left=Math.max(12,Math.min(r.right-w,vw-w-12)),top=r.bottom+8;if(top+h>vh-12)top=Math.max(12,r.top-8-h);
  el.style.left=left+'px';el.style.top=top+'px';
  el.style.transformOrigin=(r.left+r.width/2-left)+'px '+(r.top+r.height/2-top)+'px';
  void el.offsetWidth;el.classList.add('open');trig.classList.add('gm-away');gmHL(null)}
function gmClose(){if(!GM.open)return;GM.open=false;GM.drag=false;var tr=GM.trig;GM.el.classList.remove('open');GM.el.style.transition='';GM.el.style.transform='';GM.veil.hidden=true;
  setTimeout(function(){tr.classList.remove('gm-away')},120);setTimeout(function(){if(!GM.open)GM.el.hidden=true},260)}
function gmRowAt(x,y){var e=document.elementFromPoint&&document.elementFromPoint(x,y);return e&&e.closest?e.closest('.gm-item:not([disabled])'):null}
function gmHL(row){if(!row){GM.hl.style.opacity=0;return}GM.hl.style.opacity=1;GM.hl.style.height=row.offsetHeight+'px';GM.hl.style.transform='translateY('+row.offsetTop+'px)'}
function gmJelly(x,y){var el=GM.el,cx=parseFloat(el.style.left)+el.offsetWidth/2,cy=parseFloat(el.style.top)+el.offsetHeight/2,dx=x-cx,dy=y-cy,k=.04,
  mx=Math.max(-8,Math.min(8,dx*k)),my=Math.max(-8,Math.min(8,dy*k)),sc=1+Math.min(.025,Math.hypot(dx,dy)/6000);
  el.style.transition='transform .09s ease-out';el.style.transform='translate('+mx+'px,'+my+'px) scale('+sc+')'}
function gmUnjelly(){GM.el.style.transition='';GM.el.style.transform=''}
function gmChoose(row){var it=GM.items[+row.dataset.k];if(!it)return;
  if(it.keepOpen){if(it.onSelect)it.onSelect();var k=row.dataset.k;gmRender();var nr=GM.list.querySelector('[data-k="'+k+'"]');gmHL(nr);gmUnjelly()}
  else{gmClose();if(it.onSelect)setTimeout(it.onSelect,160)}}
GM.veil.addEventListener('pointerdown',function(e){e.preventDefault();gmClose()});
GM.el.addEventListener('click',function(e){var row=e.target.closest&&e.target.closest('.gm-item');if(row&&!row.disabled)gmChoose(row)});
GM.el.addEventListener('pointermove',function(e){if(e.pointerType==='mouse'&&!GM.drag)gmHL(gmRowAt(e.clientX,e.clientY))});
GM.el.addEventListener('pointerleave',function(){if(!GM.drag)gmHL(null)});
GM.el.addEventListener('keydown',function(e){var its=[].slice.call(GM.el.querySelectorAll('.gm-item:not([disabled])')),i=its.indexOf(document.activeElement);
  if(e.key==='ArrowDown'){e.preventDefault();its[(i+1)%its.length].focus()}
  else if(e.key==='ArrowUp'){e.preventDefault();its[(i<=0?its.length:i)-1].focus()}
  else if(e.key==='Escape'){e.stopPropagation();var tr=GM.trig;gmClose();if(tr)tr.focus()}});
function gmBind(trig,getItems){var t0=0,sx=0,sy=0,moved=false,pid=null;trig.classList.add('gtrig');
  trig.addEventListener('pointerdown',function(e){if(GM.open||e.button>0)return;pid=e.pointerId;t0=e.timeStamp;sx=e.clientX;sy=e.clientY;moved=false;try{trig.setPointerCapture(pid)}catch(x){}gmOpen(trig,getItems);GM.drag=true});
  trig.addEventListener('pointermove',function(e){if(e.pointerId!==pid||!GM.drag)return;if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>6)moved=true;if(moved){gmHL(gmRowAt(e.clientX,e.clientY));gmJelly(e.clientX,e.clientY)}});
  function up(e){if(e.pointerId!==pid)return;pid=null;GM.drag=false;var row=gmRowAt(e.clientX,e.clientY);
    if(row&&(moved||e.timeStamp-t0>350))gmChoose(row);else{gmUnjelly();gmHL(null)}}
  trig.addEventListener('pointerup',up);
  trig.addEventListener('pointercancel',function(e){if(e.pointerId!==pid)return;pid=null;GM.drag=false;gmClose()});
  trig.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();gmOpen(trig,getItems);var f=GM.el.querySelector('.gm-item:not([disabled])');if(f)f.focus()}})}
function setLang(l){if(l===S.lang)return;S.lang=l;jset(SK,S);applyLang()}

$('langOpts').onclick=function(e){var l=e.target.dataset&&e.target.dataset.l;if(l&&l!==S.lang){S.lang=l;jset(SK,S);applyLang()}};
applyS();applyLang();
if(list().length){go()}else{ent($('setup'))}
})();
